<!DOCTYPE html>
<html>
<head>

<title>Cart</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar custom-navbar">
<div class="container d-flex justify-content-between">

<h4 class="text-white">ServiceHub</h4>

<div>
<span class="text-white me-3" id="username"></span>

<button class="btn btn-light me-2" onclick="goServices()">Services</button>

<button class="btn btn-warning me-2" onclick="goToCart()">Cart 🛒</button>

<button class="btn btn-light" onclick="logout()">Logout</button>
</div>

</div>
</nav>


<div class="container mt-5">

<h2 class="text-center mb-4">Your Cart</h2>

<div id="cartContainer"></div>

<h3 class="text-end mt-4" id="totalAmount">Total: ₹0</h3>

<div class="text-end mt-3">

<button class="btn btn-secondary me-2" onclick="goServices()">
Continue Shopping
</button>

<button class="btn btn-success" onclick="placeOrder()">
Place Order
</button>

</div>

</div>

<script src="js/utils.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
