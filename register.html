<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="auth-page">

<div class="auth-card">

<h2 class="auth-title">Create Account</h2>

<form id="registerForm">

<input type="text" id="name" class="auth-input" placeholder="Name" required>

<input type="email" id="email" class="auth-input" placeholder="Email" required>

<input type="password" id="password" class="auth-input" placeholder="Password" required>

<input type="text" id="phone" class="auth-input" placeholder="Phone" required>

<input type="text" id="address" class="auth-input" placeholder="Address" required>

<input type="text" id="city" class="auth-input" placeholder="City" required>

<button class="auth-btn" type="submit">Register</button>

</form>

<p class="auth-link">
Already have account? <a href="login.html">Login</a>
</p>

</div>

<script src="js/utils.js"></script>
<script src="js/register.js"></script>

</body>
</html>
